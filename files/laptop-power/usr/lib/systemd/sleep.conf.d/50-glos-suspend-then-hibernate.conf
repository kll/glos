# Used by systemd-suspend-then-hibernate (and by systemd-suspend.service, which
# the laptop-power module redirects to suspend-then-hibernate).
[Sleep]
# On battery: s2idle for at most 2h, then wake and hibernate (zero drain).
# systemd also hibernates early if the battery drops below 5% while suspended.
HibernateDelaySec=2h
# On AC: stay suspended; the 2h countdown starts only once unplugged.
HibernateOnACPower=no
