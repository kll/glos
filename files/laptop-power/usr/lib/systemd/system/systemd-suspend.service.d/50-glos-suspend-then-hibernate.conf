# Every suspend request (lid close, COSMIC's Suspend menu entry, and cosmic-idle,
# which runs `systemctl suspend`) ends up here, so make plain suspend behave as
# suspend-then-hibernate. If hibernation is unavailable, systemd-sleep logs
# "Couldn't hibernate" and suspends again instead of failing.
[Service]
ExecStart=
ExecStart=/usr/lib/systemd/systemd-sleep suspend-then-hibernate
