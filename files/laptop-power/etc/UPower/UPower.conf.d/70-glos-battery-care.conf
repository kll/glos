# Act before the cell gets deeply discharged. Defaults are 20/5/2% with
# CriticalPowerAction=Auto (HybridSleep), which keeps draining the battery
# in suspend after the image is written.
[UPower]
PercentageLow=20.0
PercentageCritical=10.0
PercentageAction=7.0
# Falls back to PowerOff if hibernation is unavailable.
CriticalPowerAction=Hibernate
