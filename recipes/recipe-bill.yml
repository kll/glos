---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: glos-bill
# description will be included in the image's metadata
description: Bazzite (dx) with the COSMIC desktop instead of GNOME, for machine bill.
# custom tags on the recipe’s final image
alt-tags:
  - stable

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/kll/glos-bazzite-dx-gnome
image-version: stable

# module configuration, executed in order
# you can include multiple instances of the same module
modules:
  # replace GNOME with a native COSMIC desktop and apps
  - from-file: common-bazzite-cosmic.yml

  # 75-80% charge limit, suspend-then-hibernate, low-battery hibernate
  - from-file: common-laptop-power.yml

  - type: dnf
    install:
      packages:
        - awscli2
        - lsp-plugins         # for Easy Effects loudness meter
